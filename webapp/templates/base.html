<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Datos Físicos{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            width: 70%;
            height: 70%;
            transform: translate(-50%, -50%);
            background: url("/static/escudo.jpg") no-repeat center center;
            background-size: contain;
            opacity: 0.08; /* cuanto más bajo, más difuminado */
            z-index: -1;
            pointer-events: none;
            filter: blur(2px);
        }

        .navbar {
            background-color: #2d89ef;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }

        h1, h2 {
            color: #222;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button, .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2d89ef;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover, .btn:hover {
            background-color: #1b5fa7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2d89ef;
            color: white;
        }

        a {
            text-decoration: none;
            color: #2d89ef;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .volver {
            margin-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/">Inicio</a>
        <a href="/gestion">Gestión</a>
        <a href="/resultados">Resultados</a>
        <a href="/comparacion">Comparación</a>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
